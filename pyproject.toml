# Phase 1A packaging: pinned deps, pinned interpreter, ruff/mypy/pytest config.
# Tested interpreter: CPython 3.14.7 on macOS arm64 (2026-09-11).
# onnxruntime pin re-checked against PyPI on 2026-09-11: 1.30.0 is current
# (S1's 1.29.0 is superseded) with a cp314 macosx_14_0_arm64 wheel present.

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "facecore"
version = "0.1.0"
description = "Portable on-device face-recognition core (Phase 1A: static-image CLI + evaluation harness)"
requires-python = "==3.14.*"
dependencies = [
    "onnxruntime==1.30.0",
    "numpy==2.5.3",
    "pillow==12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
    "mypy==2.3.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
