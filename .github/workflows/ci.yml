# PR-D CI (operator-via-codex addition): existing verification commands only.
# Matrix: macos-14 (arm64) + ubuntu-latest, Python 3.14.
# Steps install the pinned dev deps then run pytest, ruff check, mypy.
# The independent `scale` job runs the full 500-identity synthetic
# benchmark on ubuntu-latest (carry-forward item 3): wall-clock ~10s,
# budgets comparison p95 <= 3.0 ms / fetch+decrypt p95 <= 15.0 ms.
# An overrun fails the job and is recorded, never fitted.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install package with dev extras
        run: pip install -e .[dev]
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Lint
        run: ruff check src tests
      - name: Typecheck
        run: mypy src

  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install package with dev extras
        run: pip install -e .[dev]
      - name: Full 500-identity synthetic scale run
        run: python scripts/run_500_scale.py

  qt-smoke:
    strategy:
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Install package with research UI extra
        run: pip install -e .[dev,research-ui]
      - name: Fetch the frozen detector artifact
        # D4-F1 (issue #123): the demo-mode trace-wiring guard drives the
        # real checkpoint presence path, and that path builds the true
        # YuNet detector — so it needs the artifact, not just the extra.
        # Without this step those guards are collected by `verify` and
        # silently SKIPPED there (no pyside6), which is how they shipped
        # once already: present, mutation-proven, and never run by any
        # job. Downloaded here and verified against the same frozen
        # constant the product code enforces at load time
        # (research/cli.py TRUE_DETECTOR_SHA256), so a substituted or
        # truncated file fails the job instead of reaching the tests.
        #
        # The URL is the one already recorded in this repo
        # (docs/research/2026-09-10-model-candidate-gate.md §1A) with its
        # media-URL fallback, git blob identity and MIT licence text.
        # Measured 2026-09-30: the fetched file is byte-identical to the
        # local ~/facecore-models artifact.
        #
        # Model WEIGHTS, not faces: this does not cross the G3 boundary.
        # It lands in the runner's $HOME, outside the checkout, and
        # /models/ is gitignored — weights never enter Git.
        run: |
          set -eu
          DEST="${HOME}/facecore-models"
          URL="https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx"
          MEDIA="https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx"
          mkdir -p "$DEST"
          curl -sSL --fail -o "$DEST/face_detection_yunet_2023mar.onnx" "$URL" \
            || curl -sSL --fail -o "$DEST/face_detection_yunet_2023mar.onnx" "$MEDIA"
          python - <<'PY'
          import hashlib, pathlib, sys

          EXPECTED = "8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4"
          path = pathlib.Path.home() / "facecore-models" / "face_detection_yunet_2023mar.onnx"
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          if digest != EXPECTED:
              sys.exit(
                  f"detector artifact hash mismatch: {digest} != {EXPECTED}"
              )
          print(f"detector artifact verified: {digest}")
          PY
      - name: Run offscreen synthetic Qt smoke
        # D1: the operator-visible result classification (B1/S1) is
        # skipped when pyside6 is absent, so the `verify` job — which
        # installs .[dev] only — cannot exercise it. It must be run
        # here, where research-ui is installed, or the split between
        # "saw a face, evidence too thin" and "not enrolled" would ship
        # with no CI guard at all.
        run: |
          python -m pytest tests/live/test_qt_window.py -q
          python -m pytest \
            tests/live/test_d1_result_visibility.py \
            tests/live/test_d1_camera_clock.py -q
          # D2: the worker lifecycle and the GUI-vs-offscreen wiring split
          # only exist where pyside6 does, for the same reason as above —
          # without this the inference worker would ship unguarded.
          python -m pytest tests/live/test_d2_inference_worker.py -q
          # D3: result verifiability panel and failure reason visibility
          python -m pytest tests/live/test_d3_result_verifiability.py -q
          # D3b: recording stays byte-identical, demo mode records nothing.
          # The byte-level proofs only mean something where the Qt window
          # and the consent-gated cmd_live path actually run.
          python -m pytest tests/live/test_d3b_optional_recording.py -q
          # D2b: the camera handle now outlives a round, so the release
          # path and the "next round reuses the open lens" path are
          # only observable where the real Qt window runs. The
          # open_calls/close_calls assertions in this file are the guard
          # for the continuous-preview decision.
          python -m pytest tests/live/test_d2b_continuous_preview.py -q
          # D4-F1: demo mode must not hand a no-op recorder to the trace
          # channel (issue #123), and an inference worker that dies must
          # produce a VISIBLE terminal. Only this job runs them: the
          # wiring guard needs research-ui AND the detector artifact
          # fetched above, the worker guard needs research-ui only. In
          # `verify` (.[dev]) all eight are collected and skipped — which
          # is exactly how they shipped once without any job running them.
          python -m pytest tests/live/test_d4f1_demo_trace_wiring.py -q
          python -m pytest tests/live/test_d4f1_worker_failure_visibility.py -q
          # D7-A W3: the demo log's diagnostic columns are only proven on
          # a REAL round — `recognition_duration_ms` and `frames_rejected`
          # must be non-empty when a round actually reaches a terminal, not
          # merely present in the header. The file lives in tests/cli/ but
          # the guarantee it carries is the Qt demo path, and it is skipped
          # whenever pyside6 is absent, so the `verify` job (.[dev] only)
          # collects it and skips it. Listed here explicitly for the same
          # reason as the D4-F1 pair above: without a job running it, the
          # primary evidence for the new columns exists only on a
          # contributor's machine.
          python -m pytest tests/cli/test_d7_w3_diagnostic_log_fields.py -q
      - name: Run G3 Start-gated integration (R1 §2/§5, PR-B)
        run: >-
          python -m pytest
          tests/live/test_g3_start_gated_flow.py
          tests/live/test_g3_commit_on_label.py
          -q
      - name: Run Qt lifecycle regression (staging fail-closed)
        run: >-
          python -m pytest
          tests/research/test_cli_lifecycle.py::test_staging_failure_refuses_commit_and_marks_error
          -q
