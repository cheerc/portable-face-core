# PR-D CI (operator-via-codex addition): existing verification commands only.
# Matrix: macos-14 (arm64) + ubuntu-latest, Python 3.14.
# Steps install the pinned dev deps then run pytest, ruff check, mypy.
# The independent `scale` job runs the full 500-identity synthetic
# benchmark on ubuntu-latest (carry-forward item 3): wall-clock ~10s,
# budgets comparison p95 <= 3.0 ms / fetch+decrypt p95 <= 15.0 ms.
# An overrun fails the job and is recorded, never fitted.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install package with dev extras
        run: pip install -e .[dev]
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Lint
        run: ruff check src tests
      - name: Typecheck
        run: mypy src

  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install package with dev extras
        run: pip install -e .[dev]
      - name: Full 500-identity synthetic scale run
        run: python scripts/run_500_scale.py

  qt-smoke:
    strategy:
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Install package with research UI extra
        run: pip install -e .[dev,research-ui]
      - name: Run offscreen synthetic Qt smoke
        # D1: the operator-visible result classification (B1/S1) is
        # skipped when pyside6 is absent, so the `verify` job — which
        # installs .[dev] only — cannot exercise it. It must be run
        # here, where research-ui is installed, or the split between
        # "saw a face, evidence too thin" and "not enrolled" would ship
        # with no CI guard at all.
        run: |
          python -m pytest tests/live/test_qt_window.py -q
          python -m pytest \
            tests/live/test_d1_result_visibility.py \
            tests/live/test_d1_camera_clock.py -q
          # D2: the worker lifecycle and the GUI-vs-offscreen wiring split
          # only exist where pyside6 does, for the same reason as above —
          # without this the inference worker would ship unguarded.
          python -m pytest tests/live/test_d2_inference_worker.py -q
          # D3: result verifiability panel and failure reason visibility
          python -m pytest tests/live/test_d3_result_verifiability.py -q
      - name: Run G3 Start-gated integration (R1 §2/§5, PR-B)
        run: >-
          python -m pytest
          tests/live/test_g3_start_gated_flow.py
          tests/live/test_g3_commit_on_label.py
          -q
      - name: Run Qt lifecycle regression (staging fail-closed)
        run: >-
          python -m pytest
          tests/research/test_cli_lifecycle.py::test_staging_failure_refuses_commit_and_marks_error
          -q
